version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustwrite-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=TrustWrite
      - DATABASE_URL=sqlite:///./trustwrite.db
      - SECRET_KEY=trustwrite-production-secret-key-change-in-prod
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - FREE_WORDS_PER_ANALYSIS=5000
    volumes:
      - backend-data:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trustwrite-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
